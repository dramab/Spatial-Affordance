# ============================================================
# configs/base/model.yaml
# 模型结构超参配置（backbone类型、融合层数、head参数）
# ============================================================

image_backbone:
  type: "resnet50"          # resnet50 | resnet101 | vit_base
  pretrained: true
  out_channels: 256
  freeze: false

pc_backbone:
  type: "voxelnet"
  unit: "cm"
  voxel_size_cm: [2.0, 2.0, 2.0]
  point_cloud_range_cm: [-80.0, -80.0, -10.0, 80.0, 80.0, 120.0]
  max_points_per_voxel: 32
  max_voxels: 20000
  input_feature_dim: 6
  svfe_hidden_channels: 32
  svfe_out_channels: 128
  cml_channels: [128, 128, 128]
  return_dense: true

text_encoder:
  type: "bert-base-uncased"
  out_channels: 256
  max_length: 64
  freeze: false

fusion:
  type: "cross_attention"
  num_layers: 3
  num_heads: 8
  hidden_dim: 256
  dropout: 0.1

bbox3d_head:
  hidden_dim: 256
  num_layers: 2
  out_dim: 7                # cx, cy, cz, l, w, h, yaw
