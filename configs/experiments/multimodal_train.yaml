model_config_path: configs/base/model.yaml

dataset:
  annotation_dir: data/annotations/placement_multimodal
  prompt_key: prompt
  image_size: [480, 640]
  scale_eps: 1.0e-6

dataloader:
  train_batch_size: 20
  val_batch_size: 10
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  train_shuffle: true
  train_drop_last: false

optimization:
  epochs: 20
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0

scheduler:
  type: cosine
  min_lr: 1.0e-6

loss:
  center_weight: 1.0
  size_weight: 1.0
  yaw_weight: 0.5
  smooth_l1_beta: 0.1

train:
  device: cuda
  seed: 42
  log_interval: 10
  output_dir: outputs/multimodal_train
  use_amp: false
  cudnn_benchmark: true

checkpoint:
  resume_path:  outputs/multimodal_train/last.pth
  save_last_name: last.pth
  save_best_name: best.pth
