# YCB-Video test split 放置规划参数配置
# Adapter 会将 BOP 原始深度、位姿、外参和模型尺寸统一转换为 cm

# 数据集适配器
dataset:
  type: "ycb_video"
  root_dir: "/data/wenhao.hai/ycb_video/ycbv_test_all/test"
  models_info_path: "/data/wenhao.hai/ycb_video/ycbv_models/models/models_info.json"
  frame_step: 10
  min_visib_fract: 0.0

# 占据栅格
occupancy:
  voxel_size: 1.0
  pixel_stride: 2
  grid_padding: 10.0

# 放置规划
placement:
  safety_margin: 2
  yaw_steps: 24
  min_surface_area: 50.0
  min_support_ratio: 1.0
  occlusion_threshold: 0.3
  world_up: [0.0, 0.0, 1.0]
  preserve_orientation: true
  orientation_threshold_deg: 5

# 聚类
clustering:
  dbscan_eps: null
  dbscan_min_samples: 1

# 可视化
visualization:
  vis_margin_px: 30
  save_vis: true

# 计算
compute:
  use_gpu: false
  stability_chunk_size: 2000

# 输出
output:
  dir: "outputs/ycbv_test"
